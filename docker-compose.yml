services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic_solution_generator
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_solution_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

  # US9.7: one-command full-stack bring-up (simple built containers, not
  # hot-reload dev mode -- see backend/Dockerfile / frontend/Dockerfile).
  # Requires backend/.env to exist first (copy from backend/.env.example
  # and fill in OPENROUTER_API_KEY) -- api's env_file below reads it.
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Overrides whatever backend/.env has for local (non-Docker) dev --
      # inside the compose network the db is reachable by service name,
      # not 127.0.0.1. APP_DB_NAME switches to the demo database
      # (start.ps1 -Demo), which also raises the job worker's concurrency
      # so demo batches finish in minutes rather than an hour.
      #
      # Epic 38: the API connects as axyntro_app, which row-level security
      # holds to one tenant at a time; migrations and `python -m
      # app.tenancy` use the owner. The first migration of Epic 38 creates
      # axyntro_app (password axyntro_app, local only) and puts existing
      # data in the tenant "meridian", reached at localhost and
      # meridian.localhost. start.ps1 adds a second tenant, northwind.
      DATABASE_URL: postgresql+psycopg://axyntro_app:axyntro_app@db:5432/${APP_DB_NAME:-agentic_solution_generator}
      DATABASE_OWNER_URL: postgresql+psycopg://agentic:agentic@db:5432/${APP_DB_NAME:-agentic_solution_generator}
      TENANT_DEFAULT_SLUG: meridian
      TENANT_DEFAULT_NAME: Meridian Group
      # "api" is how Keycloak reaches the API inside this network (back-channel logout).
      TENANT_DEFAULT_HOSTS: localhost,127.0.0.1,api,meridian.localhost
      # Epic 38, US38.8: the operator console, at http://ops.localhost:3000,
      # connects as axyntro_platform (created by migration b4c5d6e7f8a9,
      # password axyntro_platform, local only): it may manage tenants and
      # can't read any tenant's data. Local operator sign-in by name here;
      # -Sso signs operators in through Keycloak's realm "platform".
      DATABASE_PLATFORM_URL: postgresql+psycopg://axyntro_platform:axyntro_platform@db:5432/${APP_DB_NAME:-agentic_solution_generator}
      OPERATOR_HOSTS: ops.localhost
      OPERATOR_AUTH_MODE: ${OPERATOR_AUTH_MODE:-local}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      # Epic 37, US37.14: the image defaults to production, which refuses
      # local sign-in. start.ps1 sets demo for -Demo runs.
      ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      # Epic 39: production adapters call only https -- except these hosts,
      # the local stand-in of a production system and Keycloak as its
      # authorization server (testing/runtime/). Local only.
      RUNTIME_HTTP_HOSTS: ${RUNTIME_HTTP_HOSTS:-host.docker.internal,keycloak}
      # US39.4: hosts an execution's callback_url may name (the stand-in
      # hosts the smoke test's callback receiver). Local only.
      RUNTIME_CALLBACK_HOSTS: ${RUNTIME_CALLBACK_HOSTS:-host.docker.internal}
      # The stand-in's client secret for Meridian's agent, referenced from
      # a binding as secret://tenant/core_banking_secret. Local only.
      TENANT_MERIDIAN_CORE_BANKING_SECRET: agent-loans-dev-only-secret
      # US39.16: the loan system signs its events with this, referenced from
      # an event subscription as secret://tenant/loan_events. Local only.
      TENANT_MERIDIAN_LOAN_EVENTS: loan-events-dev-only-secret
      # US39.4: Meridian's IdP is Keycloak's realm "axyntro" even while its
      # people sign in locally, so its systems can start agents with
      # client-credentials tokens (client "loan-system"). Unreachable
      # without Keycloak: then only bearer-token clients get in.
      OIDC_ISSUER: http://localhost:8180/realms/axyntro
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/axyntro/.well-known/openid-configuration
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  db-data:
