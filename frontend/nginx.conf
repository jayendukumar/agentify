server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashes every filename under /assets/ (e.g.
    # index-tDKrVzoJ.js) -- a cached copy is valid forever under that
    # exact name, since a new build ships new filenames rather than
    # mutating an existing one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html (and everything the SPA fallback below serves it for)
    # is NOT filename-hashed, so it must be revalidated on every request.
    # Without an explicit Cache-Control, a browser can treat the
    # Last-Modified-only response as heuristically fresh and skip asking
    # the server again for a while after a deploy -- silently serving a
    # stale index.html that references a previous build's now-deleted
    # /assets/ filenames (real symptom hit after a rebuild: the page
    # loaded old code and login appeared to silently fail).
    #
    # SPA fallback -- react-router routes like /processes/x/diagram have
    # no matching file on disk, so unmatched paths fall back to
    # index.html and the client-side router takes it from there.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
