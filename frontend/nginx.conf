server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- react-router routes like /processes/x/diagram have
    # no matching file on disk, so unmatched paths fall back to
    # index.html and the client-side router takes it from there.
    location / {
        try_files $uri /index.html;
    }
}
